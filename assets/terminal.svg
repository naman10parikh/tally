<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">tally --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: tally [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Product-analytics + feature-flags + experiments employee. Count what matters,</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">once, correctly; fail closed on the irreversible. Boundary: LLM token spend =</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">agentmoney, app health = canary, web stats = Plausible. Powered by Energy.</text>
<text x="24" y="186" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -v, --version                         print tally version</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  -h, --help                            display help for command</text>
<text x="24" y="266" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  track-plan [options] &lt;dir&gt;            emit a canonical typed event registry +</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                                        typed accessors + a CI check that fails</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                                        the build on a case-variant (acceptance</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                                        leg 1; J1/O1/O2/BTS-1)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  wire-flag [options] &lt;key&gt;             wire a flag through OpenFeature</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                        (DB-eval/pinned-props, never bare</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                                        local-eval) + blast-radius pre-check</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                                        (acceptance leg 2; J4/O7/BTS-12)</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  capture-event [options] &lt;name&gt;        fire a registry-conformant typed event →</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                                        capture sink with PII masked + two-call</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                                        identify ($set_once acquisition)</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                                        (acceptance leg 3; J2/J3/BTS-2/3)</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  check-experiment [options] &lt;id|spec&gt;  decide an experiment: SRM-first, peeking</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                                        guard, pre-registration,</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
